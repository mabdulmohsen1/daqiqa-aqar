name: weekly
# Sunday 09:00 Asia/Riyadh = 06:00 UTC (after the 07:30 daily run refreshed metrics).
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Weekly review
        run: |
          f=$(python engine/weekly.py)
          cat "$f" >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        run: |
          git config user.name "daqiqa-aqar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "weekly review $(date -u +%F)"
          git push
